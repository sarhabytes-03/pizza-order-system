<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slice Shop: Pizza Order System</title>
<style>
:root{--cream:#fff1d6;--card:#fffaf0;--yellow:#f4b73f;--ink:#2a2018;--soft:#7a6a58;--dark:#1d1a24;--red:#c8402b;--line:#ecd9b4}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,h4,.brand{font-family:Georgia,"Times New Roman",serif;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:.55em 1.1em;background:#fff;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
input,select{font:inherit;padding:.55em .8em;border:1.5px solid var(--line);border-radius:12px;background:#fff;width:100%}
[hidden]{display:none!important}
.auth{max-width:380px;margin:8vh auto;padding:28px;background:var(--card);border-radius:24px;box-shadow:0 10px 40px #b8861a33}
.auth h1{font-size:2rem}.auth p{color:var(--soft)}.auth label,.dlg label{display:block;margin:12px 0 4px;font-weight:600}
.auth .row{display:flex;gap:10px;margin-top:18px}.err{color:var(--red);min-height:1.4em;margin:8px 0 0}
.go{background:var(--yellow);font-weight:700}.ghost{background:#fff;border:1.5px solid var(--line)}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;flex-wrap:wrap}
.brand{font-size:1.5rem;font-weight:700;margin-right:auto}
nav button.on{background:var(--ink);color:#fff}
#who{color:var(--soft)}
#banner{margin:0 22px 8px;padding:12px 16px;border-radius:16px;background:#ffe0a3;border:2px solid var(--yellow);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#banner span{flex:1;min-width:200px}
main{display:grid;grid-template-columns:1fr 350px;gap:22px;padding:8px 22px 40px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{position:relative;background:var(--card);border-radius:22px;padding:18px 14px 16px;text-align:center;cursor:pointer;border:2px solid transparent}
.card:hover{border-color:var(--yellow)}
.card h3{font-size:1.1rem;margin-top:10px}.card p{margin:4px 0 8px;color:var(--soft);font-size:.9rem}
.card.plus{border:2px dashed #d7a93f;background:transparent}
.pz{display:block;width:130px;height:130px;margin:0 auto;filter:drop-shadow(0 6px 8px #7a4d1a50)}
.pz.big{width:190px;height:190px;margin:8px auto}
.pzadd{width:130px;height:130px;margin:0 auto;border-radius:50%;box-shadow:0 0 0 8px #ecd9b4 inset;display:grid;place-items:center;font-size:3rem;color:#c99529}
.x{position:absolute;top:8px;right:8px;padding:.2em .6em;font-size:.8rem}
.tag{font-size:.8rem;background:var(--yellow);border-radius:999px;padding:.1em .6em}
h2.t{font-size:1.4rem;margin:6px 0 14px}
aside{background:var(--dark);color:#f6ead2;border-radius:26px;padding:22px;position:sticky;top:12px}
aside h2{font-size:1.3rem;margin-bottom:10px}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff22}
.ln small{display:block;color:#b8ab95}
.qty{display:inline-flex;align-items:center;gap:10px}.qty button{width:30px;height:30px;padding:0;border-radius:50%}
aside .qty button{background:#ffffff1f;color:#fff}
.calc{margin-top:14px}.calc div.r{display:flex;justify-content:space-between;padding:3px 0}
.calc .tot{font-size:1.35rem;font-weight:700;border-top:1px solid #ffffff33;margin-top:6px;padding-top:8px}
aside input,aside select{background:#2b2733;color:#fff;border-color:#ffffff30;margin:6px 0}
aside .go{width:100%;margin-top:12px;padding:.8em}
.empty{color:#b8ab95}
.ord{background:var(--card);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.ord ul{margin:6px 0;padding-left:20px}.ord .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ord.warn{border:2px solid var(--red)}.ord em{color:var(--soft)}.ord.warn em{color:var(--red);font-weight:700}
dialog{border:0;border-radius:26px;padding:24px;width:min(460px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#1d1a2499}
dialog h4{margin:16px 0 6px}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line)}.chip.on{background:var(--yellow);border-color:var(--yellow);font-weight:700}
.dlg .row,dialog .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.price{font-size:1.5rem;font-family:Georgia,serif}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7em 1.2em;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#shift{display:flex;gap:8px;align-items:center}
.bar{position:relative;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:8px;overflow:hidden;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#f4b73f66}.bar span,.bar b{position:relative}
@media(max-width:820px){main{grid-template-columns:1fr}aside{position:static}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="auth" class="auth" hidden>
  <h1>Slice Shop</h1>
  <p>Log in to save your pizzas and see your last 7 days of orders.</p>
  <label for="un">Username</label><input id="un" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <p class="err" id="aerr"></p>
  <div class="row"><button class="go" id="login">Log in</button><button class="ghost" id="signup">Create account</button></div>
  <p><small>Accounts live only in this browser. Nothing is sent anywhere.</small></p>
</div>
<div id="app" hidden>
  <header>
    <span class="brand">Slice Shop</span>
    <nav><button data-act="tab" data-v="menu" id="t-menu">Menu</button> <button data-act="tab" data-v="hist" id="t-hist">History</button> <button data-act="tab" data-v="staff" id="t-staff">Staff</button></nav>
    <span id="shift"></span>
    <span id="who"></span><button class="ghost" id="out">Log out</button>
  </header>
  <div id="banner" hidden></div>
  <main><section id="left"></section><aside id="cart"></aside></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='slice_shop_v1',DAY=864e5,WEEK=7*DAY;
// Menu and prices come from the original C program (prices in tk)
const MENU=[
 {id:'ny',name:'New York Style',price:400,a:'#f3c76b',t:['Pepperoni'],d:'Wide, foldable slices',ing:'Hand-tossed thin crust, tomato sauce, mozzarella and pepperoni.'},
 {id:'dt',name:'Detroit Pizza',price:400,a:'#e9a23b',t:['Tomato','Capsicum'],d:'Thick, crispy-edged square',sq:true,ing:'Deep-pan square crust, tomato sauce, brick cheese baked to a crisp caramelised edge, sliced tomato and capsicum.'},
 {id:'np',name:'Neapolitan',price:500,a:'#f7e3a1',t:['Basil','Extra cheese'],d:'Tomato, mozzarella, soft crust',ing:'Soft, puffy crust, crushed tomato, fresh mozzarella and basil leaves.'},
 {id:'vg',name:'Vegan Pizza',price:300,a:'#f0cf7a',t:['Mushroom','Capsicum','Olives','Sweetcorn'],d:'Plant-based cheese and veggies',ing:'Thin crust, tomato sauce, plant-based cheese, mushroom, capsicum, olives and sweetcorn.'}];
const TOP={Mushroom:40,Olives:30,Onion:20,Capsicum:30,Tomato:20,Sweetcorn:30,Chicken:70,'Extra cheese':50};
const CUSTOM_BASE=250,MAXT=5,SIZES={S:.75,M:1,L:1.25,XL:1.5},CRUST={Thin:0,Medium:20,Thick:40};
const VAT=.05,PROMO={DIU10:.1},POSTS=['Manager','Cashier','Waiter','Chef'];
let db=load(),me=null,tab='menu',cart=[],cfg=null,promo='',viewEmp=null;

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{users:{}}}catch(e){return{users:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save: browser storage is blocked')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove('show'),2600)}

async function hash(pw,salt){
  if(!(window.crypto&&crypto.subtle)){let h=5381;for(const ch of salt+pw)h=(h*33^ch.charCodeAt(0))>>>0;return 'x'+h}
  const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function auth(create){
  const n=$('#un').value.trim().toLowerCase(),p=$('#pw').value,err=$('#aerr');
  if(!/^[a-z0-9_]{3,20}$/.test(n)){err.textContent='Username: 3 to 20 letters, numbers or underscores.';return}
  if(p.length<4){err.textContent='Password needs at least 4 characters.';return}
  let u=db.users[n];
  if(create){
    if(u){err.textContent='That username is taken. Try logging in.';return}
    const salt=Math.random().toString(36).slice(2)+Date.now();
    u=db.users[n]={salt,hash:await hash(p,salt),menu:[],orders:[],cart:[],next:1};
  }else if(!u||u.hash!==await hash(p,u.salt)){err.textContent='Wrong username or password.';return}
  err.textContent='';$('#pw').value='';db.session=n;save();start();
}
function start(){
  me=db.users[db.session];
  $('#auth').hidden=!!me;$('#app').hidden=!me;
  if(!me)return;
  $('#who').textContent=db.session;cart=me.cart||[];tab='menu';me.staff=me.staff||[];me.shifts=me.shifts||[];me.active=me.active||null;me.nextEmp=me.nextEmp||1;render();
}
function prune(){
  const n=me.orders.length;me.orders=me.orders.filter(o=>Date.now()-o.t<WEEK);
  if(me.orders.length<n){save();toast((n-me.orders.length)+' order(s) older than 7 days were cleared')}
}

// pizza pictures: each topping is a small drawing scattered over the pizza
const G={
 Pepperoni:'<circle r="5.5" fill="#b3261e"/><circle cx="-1.5" cy="-1" r=".9" fill="#7d1812"/><circle cx="2" cy="1.5" r=".9" fill="#7d1812"/>',
 Mushroom:'<path d="M-6 1a6 5.5 0 0 1 12 0z" fill="#ecdcc2" stroke="#b99b72" stroke-width=".7"/><rect x="-2" y="1" width="4" height="4.5" rx="1" fill="#d9c19a"/>',
 Olives:'<circle r="4" fill="#2d2a2a"/><circle r="1.5" fill="#f6dc8a"/>',
 Onion:'<circle r="5" fill="none" stroke="#e6c8f0" stroke-width="1.8"/>',
 Capsicum:'<path d="M-6 -1q6 -5 12 0" fill="none" stroke="#3f9a3a" stroke-width="3" stroke-linecap="round"/>',
 Tomato:'<circle r="5" fill="#d93a2b"/><circle r="2.2" fill="#f58a6b"/>',
 Sweetcorn:'<circle cx="-2.5" r="2.3" fill="#f7d23a"/><circle cx="2.5" cy="-1.5" r="2.3" fill="#f7c21a"/><circle cy="2.6" r="2.3" fill="#fbe26a"/>',
 Chicken:'<rect x="-5.5" y="-3.5" width="11" height="7" rx="3" fill="#c0833f"/><rect x="-3.5" y="-2" width="5" height="3" rx="1.5" fill="#e3ad6e"/>',
 'Extra cheese':'<ellipse rx="6.5" ry="4.2" fill="#fff3b0" opacity=".95"/>',
 Basil:'<path d="M0 -5.5q6 5.5 0 11q-6 -5.5 0 -11z" fill="#2f8a3a"/><path d="M0 -4v8" stroke="#a6d68c" stroke-width=".6"/>'};
function pizzaSVG(cheese,tops,cls,sq){
  tops=[...new Set(tops||[])];const T=tops.length,N=T?T*(T<3?8:T<4?6:5):0;let s='';
  for(let i=0;i<N;i++){const r=Math.sqrt((i+.5)/N)*33,a=i*2.39996;
    const px=sq?50+((i*.618034)%1-.5)*66:50+r*Math.cos(a),py=sq?50+((i*.754878)%1-.5)*66:50+r*Math.sin(a);
    s+=`<g transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${i*53%360})">${G[tops[i%T]]}</g>`}
  return `<svg class="pz ${cls||''}" viewBox="0 0 100 100" role="img" aria-label="Pizza with ${T?esc(tops.join(', ')):'cheese'}">${sq?`<rect x="5" y="5" width="90" height="90" rx="9" fill="#c98a45"/><rect x="10" y="10" width="80" height="80" rx="6" fill="#d6432f"/><rect x="11.5" y="11.5" width="77" height="77" rx="5" fill="${cheese}" stroke="#a85a16" stroke-width="2.2"/>`:`<circle cx="50" cy="50" r="47" fill="#d9a05b"/><circle cx="50" cy="50" r="41" fill="#d6432f"/><circle cx="50" cy="50" r="39.5" fill="${cheese}" opacity=".95"/>`}${s}</svg>`;
}
// staff and shifts: one restaurant account, one employee on shift at a time
const emp=()=>me.staff.find(z=>z.id===me.active);
function checkIn(id){
  const t=Date.now(),open=me.shifts.find(z=>!z.out);if(open)open.out=t;
  me.active=id;viewEmp=null;const e=emp();if(e)me.shifts.unshift({emp:e.id,name:e.name,in:t,out:null});
  me.shifts=me.shifts.slice(0,30);save();toast(e?e.name+' is now on shift':'Checked out');render();
}
function addEmp(){
  const n=$('#ename').value.trim().slice(0,24);if(!n){toast('Enter a name');return}
  const first=!me.staff.length;
  me.staff.push({id:me.nextEmp++,name:n,post:first?'Manager':$('#epost').value,sold:0,orders:0,rev:0});save();render();
}
function staffHTML(){
  const e=emp(),mgr=e&&e.post==='Manager',first=!me.staff.length;
  const rank=[...me.staff].sort((a,b)=>(b.sold||0)-(a.sold||0)),max=Math.max(1,...rank.map(z=>z.sold||0));
  let h='<h2 class="t">Staff</h2>';
  h+=first?'<p>No employees yet. Add the first one below. They become the Manager.</p>':'<div class="grid">'+me.staff.map(z=>`<article class="card" style="cursor:default"><h3>${esc(z.name)}</h3><p>${z.post}</p>${z.id===me.active?'<span class="tag">On shift</span>':`<button class="go" data-act="cin" data-id="${z.id}">Check in</button>`}${mgr&&z.id!==me.active?`<button class="x ghost" data-act="fire" data-id="${z.id}" aria-label="Remove ${esc(z.name)}">Remove</button>`:''}</article>`).join('')+'</div>';
  if(first||mgr)h+=`<h2 class="t" style="margin-top:26px">Add employee</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="ename" placeholder="Name" maxlength="24" aria-label="Employee name" style="flex:2;min-width:140px"><select id="epost" aria-label="Post" style="flex:1;min-width:120px">${POSTS.map(p=>`<option>${p}</option>`).join('')}</select><button class="go" data-act="hire">Add</button></div>`;
  else h+='<p style="margin-top:20px;color:var(--soft)">Only a checked-in Manager can add or remove employees.</p>';
  h+='<h2 class="t" style="margin-top:26px">Pizzas sold</h2>'+(rank.length?rank.map((z,i)=>`<div class="bar" data-act="view" data-id="${z.id}" style="cursor:pointer"><i style="width:${(z.sold||0)/max*100}%"></i><span>${i+1}. ${esc(z.name)}</span><b>${z.sold||0} pizzas, ${z.orders||0} orders, ${z.rev||0} tk</b></div>`).join(''):'<p>Sales will appear here.</p>');
  const v=me.staff.find(z=>z.id===(viewEmp||me.active));
  h+=`<h2 class="t" style="margin-top:26px">Sales history${v?': '+esc(v.name):''}</h2>`+(v?(()=>{const l=me.orders.filter(o=>o.emp===v.id),pz=l.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.q,0),0);return l.length?'<p>'+pz+' pizza(s) in '+l.length+' order(s) in the last 7 days.</p>'+l.map(ordCard).join(''):'<p>No orders served yet in the last 7 days.</p>'})():'<p>Check in, or click a name in the Pizzas sold list, to see sales history.</p>');
  h+='<h2 class="t" style="margin-top:26px">Recent shifts</h2>'+(me.shifts.length?me.shifts.slice(0,8).map(z=>`<p style="margin:2px 0">${esc(z.name)}: ${new Date(z.in).toLocaleString()} to ${z.out?new Date(z.out).toLocaleString():'now'}</p>`).join(''):'<p>No shifts yet.</p>');
  return h;
}
function ordCard(x){
    const left=Math.max(0,Math.ceil((x.t+WEEK-Date.now())/DAY));
    return `<article class="ord${left<=1?' warn':''}"><div class="top"><b>Order #${x.id}</b> <small>${x.emp?'served by '+esc(x.empName):''}</small><span>${new Date(x.t).toLocaleString()}</span></div><ul>${x.items.map(i=>`<li>${i.q} x ${esc(i.n)} (${i.s}, ${i.c} crust${i.t.length?', '+esc(i.t.join(', ')):''})</li>`).join('')}</ul><div class="top"><b>${x.total} tk</b><em>${left<=1?'Clears within 24 hours':'Clears in '+left+' days'}</em></div></article>`;
}
function receipt(o,n){
  cfg=null;$('#dlg').innerHTML=`<h2>Order #${o.id} placed</h2><p>${n} pizza(s), served by <b>${esc(o.empName)}</b>.</p><p class="price">${o.total} tk</p><div class="row"><button class="go" data-act="close">Start new order</button></div>`;$('#dlg').showModal();
}

// pricing
const topsCost=t=>t.reduce((s,x)=>s+TOP[x],0);
function unit(){const{it,size,crust}=cfg;const b=it.custom?CUSTOM_BASE+topsCost(it.tops):it.price+topsCost(it.add);return Math.round(b*SIZES[size])+CRUST[crust]}
function calc(){
  const sub=cart.reduce((s,l)=>s+l.unit*l.qty,0),disc=Math.round(sub*(PROMO[promo]||0));
  const vat=Math.round((sub-disc)*VAT);
  return{sub,disc,vat,total:sub-disc+vat};
}

// rendering
function render(){
  prune();
  $('#t-menu').classList.toggle('on',tab==='menu');$('#t-hist').classList.toggle('on',tab==='hist');$('#t-staff').classList.toggle('on',tab==='staff');
  const e=emp();$('#shift').innerHTML=e?'<b>On shift: '+esc(e.name)+'</b> ('+e.post+') <button class="ghost" data-act="cout">Check out</button>':'<button class="go" data-act="tab" data-v="staff">Check in to start</button>';
  const exp=me.orders.filter(o=>Date.now()-o.t>WEEK-DAY).length,b=$('#banner');
  b.hidden=!exp;
  if(exp)b.innerHTML='<span><b>'+exp+' order(s) will be cleared within 24 hours.</b> Download your summary before they are removed.</span><button class="go" data-act="dl">Download summary</button>';
  $('#left').innerHTML=tab==='menu'?menuHTML():tab==='hist'?histHTML():staffHTML();
  cartHTML();
}
function card(id,name,price,desc,svg,extra){
  return `<article class="card" data-act="open" data-id="${id}">${extra||''}${svg}<h3>${esc(name)}</h3><p>${esc(desc)}</p><b>${price} tk</b></article>`;
}
function menuHTML(){
  const base=MENU.map(m=>card(m.id,m.name,m.price,m.d,pizzaSVG(m.a,m.t,'',m.sq))).join('');
  const mine=me.menu.map(c=>card(c.id,c.name,CUSTOM_BASE+topsCost(c.tops),c.tops.join(', ')||'No toppings',pizzaSVG('#f0cf7a',c.tops),'<button class="x ghost" data-act="del" data-id="'+c.id+'" aria-label="Remove '+esc(c.name)+' from my menu">Remove</button>')).join('');
  return '<h2 class="t">Menu</h2><div class="grid">'+base+
    '<article class="card plus" data-act="open" data-id="new"><div class="pzadd">+</div><h3>Create your own</h3><p>Choose size, crust and up to '+MAXT+' toppings</p><b>from '+CUSTOM_BASE+' tk</b></article></div>'+
    (mine?'<h2 class="t" style="margin-top:26px">My saved pizzas</h2><div class="grid">'+mine+'</div>':'');
}
function histHTML(){
  const o=me.orders,tot=o.reduce((s,x)=>s+x.total,0);
  let h='<h2 class="t">History: last 7 days</h2><div class="row" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><span>'+o.length+' order(s), '+tot+' tk in total</span><button class="go" data-act="dl">Download summary</button></div>';
  if(!o.length)return h+'<p>No orders yet. Pick a pizza from the menu and place an order.</p>';
  return h+o.map(ordCard).join('');
}
function cartHTML(){
  const c=calc();
  let h='<h2>Your cart</h2>';
  if(!cart.length)h+='<p class="empty">Nothing here yet. Choose a pizza to start your order.</p>';
  h+=cart.map((l,i)=>`<div class="ln"><div><b>${esc(l.name)}</b><small>${l.size}, ${l.crust} crust${l.tops.length?', '+esc(l.tops.join(', ')):''}</small></div><div class="qty"><button data-act="cl" data-i="${i}" data-v="-1" aria-label="Fewer">−</button><b>${l.qty}</b><button data-act="cl" data-i="${i}" data-v="1" aria-label="More">+</button></div><span>${l.unit*l.qty} tk</span></div>`).join('');
  h+=`<div class="calc"><input id="promo" placeholder="Promo code (try DIU10)" value="${esc(promo)}">
  <div class="r"><span>Subtotal</span><span>${c.sub} tk</span></div>
  ${c.disc?`<div class="r"><span>Promo discount</span><span>−${c.disc} tk</span></div>`:''}
  <div class="r"><span>VAT (5%)</span><span>${c.vat} tk</span></div>
  
  <div class="r tot"><span>Total</span><span>${c.total} tk</span></div></div>
  <p class="empty" style="margin:10px 0 0">${emp()?'Served by '+esc(emp().name):'Check in on the Staff tab to take orders'}</p><button class="go" data-act="place">Place order</button>`;
  $('#cart').innerHTML=h;
}

// pizza dialog
function chip(kind,v,on,extra){return `<button class="chip${on?' on':''}" data-act="${kind}" data-v="${esc(v)}">${esc(v)}${extra||''}</button>`}
function dlg(){
  const d=$('#dlg');if($('#pname'))cfg.it.name=$('#pname').value;
  const{it,size,crust,qty}=cfg;
  d.innerHTML=`<h2>${it.custom?'Create your own':esc(it.name)}</h2>`+pizzaSVG(it.a||'#f0cf7a',it.custom?it.tops:it.t.concat(it.add),'big',it.sq)+
   (it.custom?`<label for="pname">Pizza name</label><input id="pname" maxlength="24" value="${esc(it.name)}">`:`<p><b>What’s on it:</b> ${esc(it.ing)}</p>`)+
   `<h4>Size</h4><div class="chips">${Object.keys(SIZES).map(s=>chip('size',s,s===size)).join('')}</div>`+
   `<h4>Crust</h4><div class="chips">${Object.keys(CRUST).map(c=>chip('crust',c,c===crust,CRUST[c]?' +'+CRUST[c]+' tk':'')).join('')}</div>`+
   (()=>{const L=it.custom?it.tops:it.add;return `<h4>${it.custom?'Toppings':'Extra add-ons'} (${L.length} of ${MAXT})</h4><div class="chips">${Object.keys(TOP).map(t=>chip('top',t,L.includes(t),' +'+TOP[t]+' tk')).join('')}</div>`})()+
   `<div class="row"><div class="qty"><button class="ghost" data-act="q" data-v="-1" aria-label="Fewer">−</button><b>${qty}</b><button class="ghost" data-act="q" data-v="1" aria-label="More">+</button></div><span class="price">${unit()*qty} tk</span></div>`+
   `<div class="row"><button class="ghost" data-act="close">Cancel</button>${it.custom?'<button class="ghost" data-act="savem">Save to my menu</button>':''}<button class="go" data-act="add">Add to cart</button></div>`;
  if(!d.open)d.showModal();
}
function openItem(id){
  let it;
  if(id==='new')it={custom:true,name:'My pizza',tops:[],id:null};
  else if(id[0]==='u'){const c=me.menu.find(z=>z.id===id);it={custom:true,name:c.name,tops:[...c.tops],id:c.id}}
  else it={...MENU.find(z=>z.id===id),custom:false,add:[]};
  cfg={it,size:'M',crust:'Medium',qty:1};dlg();
}
function persist(){me.cart=cart;save()}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  if(a==='tab'){tab=v;render()}
  else if(a==='open')openItem(id);
  else if(a==='del'){me.menu=me.menu.filter(z=>z.id!==id);save();render()}
  else if(a==='size'||a==='crust'){cfg[a]=v;dlg()}
  else if(a==='top'){const t=cfg.it.custom?cfg.it.tops:cfg.it.add,i=t.indexOf(v);
    if(i>=0)t.splice(i,1);else if(t.length>=MAXT)toast('You can add up to '+MAXT+' toppings');else t.push(v);dlg()}
  else if(a==='q'){cfg.qty=Math.min(20,Math.max(1,cfg.qty+ +v));dlg()}
  else if(a==='close')$('#dlg').close();
  else if(a==='savem'){
    const n=($('#pname').value.trim()||'My pizza').slice(0,24),it=cfg.it;
    if(it.id){const c=me.menu.find(z=>z.id===it.id);c.name=n;c.tops=[...it.tops]}
    else me.menu.push({id:'u'+Date.now(),name:n,tops:[...it.tops]});
    save();$('#dlg').close();toast('Saved to your menu');render();
  }
  else if(a==='add'){
    const it=cfg.it,n=it.custom?($('#pname').value.trim()||'My pizza').slice(0,24):it.name;
    cart.push({name:n,size:cfg.size,crust:cfg.crust,tops:it.custom?[...it.tops]:it.add.map(x=>'extra '+x),qty:cfg.qty,unit:unit()});
    persist();$('#dlg').close();toast('Added to cart');render();
  }
  else if(a==='cl'){const l=cart[+b.dataset.i];l.qty+=+v;if(l.qty<1)cart.splice(+b.dataset.i,1);persist();cartHTML()}
  else if(a==='place'){
    if(!cart.length){toast('Add a pizza to your cart first');return}
    const e=emp();if(!e){toast('Check in on the Staff tab before taking orders');return}
    const c=calc(),o={id:me.next++,t:Date.now(),emp:e.id,empName:e.name,...c,items:cart.map(l=>({n:l.name,s:l.size,c:l.crust,t:l.tops,q:l.qty,u:l.unit}))};
    const n=cart.reduce((s,l)=>s+l.qty,0);e.sold=(e.sold||0)+n;e.orders=(e.orders||0)+1;e.rev=(e.rev||0)+c.total;
    me.orders.unshift(o);cart=[];promo='';persist();receipt(o,n);render();
  }
  else if(a==='cin')checkIn(+id);
  else if(a==='cout')checkIn(null);
  else if(a==='hire')addEmp();
  else if(a==='fire'){if(+id===me.active)toast('Check out first');else{me.staff=me.staff.filter(z=>z.id!==+id);save();render()}}
  else if(a==='view'){viewEmp=+id;render()}
  else if(a==='dl')download();
});
document.addEventListener('change',e=>{
  
  if(e.target.id==='promo'){
    const p=e.target.value.trim().toUpperCase();
    promo=PROMO[p]?p:'';if(p&&!promo)toast('That promo code is not valid');cartHTML();
  }
});
function download(){
  if(!me.orders.length){toast('No orders to download yet');return}
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"',o=me.orders.slice().reverse(),sum=k=>o.reduce((s,x)=>s+x[k],0);
  const rows=[['Order','Date','Served by','Items','Subtotal','Discount','VAT','Total']];
  o.forEach(x=>rows.push([x.id,new Date(x.t).toLocaleString(),x.empName||'-',x.items.map(i=>i.q+' x '+i.n+' ('+i.s+', '+i.c+(i.t.length?', '+i.t.join('+'):'')+')').join(' | '),x.sub,x.disc,x.vat,x.total]));
  rows.push(['TOTAL','','',o.length+' orders',sum('sub'),sum('disc'),sum('vat'),sum('total')]);
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='pizza-summary-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Summary downloaded');
}
$('#login').onclick=()=>auth(false);$('#signup').onclick=()=>auth(true);
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')auth(false)});
$('#out').onclick=()=>{db.session=null;save();start()};
start();
</script>
